<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | Takhun Trip Admin</title>
  <meta name="description" content="เข้าสู่ระบบผู้ดูแล Takhun Trip">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <main class="login-shell">
    <form class="login-card">
      <h1>เข้าสู่ระบบผู้ดูแล</h1>
      <label for="username">ชื่อผู้ใช้</label>
      <input id="username" name="username" type="text" autocomplete="username">
      <label for="password">รหัสผ่าน</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button class="button" type="submit" disabled>ระบบเข้าสู่ระบบอยู่ระหว่างการจัดเตรียม</button>
      <a href="../index.html">กลับหน้าเว็บไซต์</a>
    </form>
  </main>
</body>
</html>
